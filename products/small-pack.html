<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SMALL PACK</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<canvas id="bg"></canvas>

<div class="overlay"></div>

<div class="container">

<img
src="../assets/products/small-pack.png"
class="product-image"
>

<h1 class="title">
SMALL PACK
</h1>

<div class="glass-box">

<h2 class="section-title">
Instruction
</h2>

<div class="description">

<ul>

<li>
Affordable starter diamonds bundle.
</li>

<li>
Manual top-up delivery service.
</li>

<li>
Fast admin support available.
</li>

<li>
Please enter correct IDs.
</li>

</ul>

</div>

</div>

<div class="glass-box">

<h2 class="section-title">
ENTER IDS
</h2>

<input
type="text"
placeholder="USER ID"
class="input"
>

<input
type="text"
placeholder="SERVER ID"
class="input"
>

<button class="check-btn">
Check Username
</button>

<div class="username-box">
Username: Not Checked
</div>

</div>

<div class="glass-box">

<h2 class="section-title">
Choose Packs
</h2>

<div class="pack-grid">

<button class="pack-btn">
50 Diamonds
</button>

<button class="pack-btn">
100 Diamonds
</button>

<button class="pack-btn">
250 Diamonds
</button>

</div>

</div>

<div class="glass-box">

<h2 class="section-title">
Choose Payment Method
</h2>

<div class="payment-icons">

<div class="payment-card">

<img
src="../assets/payments/upi.png"
class="payment-img"
>

<p>
UPI
</p>

</div>

<div class="payment-card">

<img
src="../assets/payments/phonepe.png"
class="payment-img"
>

<p>
PhonePe
</p>

</div>

<div class="payment-card">

<img
src="../assets/payments/paytm.png"
class="payment-img"
>

<p>
Paytm
</p>

</div>

<div class="payment-card">

<img
src="../assets/payments/gpay.png"
class="payment-img"
>

<p>
GPay
</p>

</div>

</div>

<button class="buy-btn">
BUY NOW
</button>

</div>

</div>

<script src="../script.js"></script>

</body>

</html>
