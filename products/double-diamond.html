<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>DOUBLE DIAMONDS</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<canvas id="bg"></canvas>

<div class="overlay"></div>

<div class="container">

<img
src="../assets/products/double-diamond.png"
class="product-image"
>

<h1 class="title">
DOUBLE DIAMONDS
</h1>

<div class="glass-box">

<h2 class="section-title">
Instruction
</h2>

<div class="description">

<ul>

<li>
Special double diamonds bonus packs.
</li>

<li>
Limited event based recharge.
</li>

<li>
Fast manual admin delivery.
</li>

<li>
Enter correct game IDs carefully.
</li>

</ul>

</div>

</div>

<div class="glass-box">

<h2 class="section-title">
ENTER IDS
</h2>

<input
type="text"
placeholder="USER ID"
class="input"
>

<input
type="text"
placeholder="SERVER ID"
class="input"
>

<button class="check-btn">
Check Username
</button>

<div class="username-box">
Username: Not Checked
</div>

</div>

<div class="glass-box">

<h2 class="section-title">
Choose Packs
</h2>

<div class="pack-grid">

<button class="pack-btn">
250 + 250
</button>

<button class="pack-btn">
500 + 500
</button>

<button class="pack-btn">
1000 + 1000
</button>

</div>

</div>

<div class="glass-box">

<h2 class="section-title">
Choose Payment Method
</h2>

<div class="payment-icons">

<div class="payment-card">

<img
src="../assets/payments/upi.png"
class="payment-img"
>

<p>
UPI
</p>

</div>

<div class="payment-card">

<img
src="../assets/payments/phonepe.png"
class="payment-img"
>

<p>
PhonePe
</p>

</div>

<div class="payment-card">

<img
src="../assets/payments/paytm.png"
class="payment-img"
>

<p>
Paytm
</p>

</div>

<div class="payment-card">

<img
src="../assets/payments/gpay.png"
class="payment-img"
>

<p>
GPay
</p>

</div>

</div>

<button class="buy-btn">
BUY NOW
</button>

</div>

</div>

<script src="../script.js"></script>

</body>

</html>
