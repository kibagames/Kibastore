<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Double Diamonds</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<canvas id="bg"></canvas>

<div class="overlay"></div>

<div class="container">

<img
src="../assets/products/double-diamond.png"
class="product-image"
>

<h1 class="title">
DOUBLE DIAMONDS
</h1>

<div class="glass-box">

<h2 class="section-title">
Instruction
</h2>

<div class="description">

<ul>

<li>
Special bonus double diamond packs.
</li>

<li>
Limited promotional rewards.
</li>

<li>
Delivered manually by admin.
</li>

<li>
Safe and smooth top-up process.
</li>

</ul>

</div>

</div>

<div class="glass-box">

<h2 class="section-title">
ENTER IDS
</h2>

<input
type="text"
placeholder="USER ID"
class="input"
>

<input
type="text"
placeholder="SERVER ID"
class="input"
>

<button class="check-btn">
Check Username
</button>

<div class="username-box">
Username:
Not Checked
</div>

</div>

<div class="glass-box">

<h2 class="section-title">
Choose Packs
</h2>

<div class="pack-grid">

<button class="pack-btn">
2x Bonus Small
</button>

<button class="pack-btn">
2x Bonus Medium
</button>

<button class="pack-btn">
2x Bonus Large
</button>

</div>

</div>

<div class="glass-box">

<h2 class="section-title">
Choose Payment Method
</h2>

<div class="payment-grid">

<button class="payment-btn">
UPI
</button>

<button class="payment-btn">
PhonePe
</button>

<button class="payment-btn">
Paytm
</button>

</div>

</div>

<button class="buy-btn">
BUY NOW
</button>

</div>

<script src="../script.js"></script>

</body>

</html>
