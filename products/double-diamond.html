<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>DOUBLE DIAMONDS</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<img
src="../assets/frames/ezgif-frame-001.png"
class="background"
>

<div class="overlay"></div>

<div class="container">

<img
src="../assets/products/double-diamond.png"
class="product-image"
>

<div class="title">
DOUBLE DIAMONDS
</div>

<div class="glass-box">

<h2 class="section-title">
Instruction
</h2>

<div class="description">

<p>
Receive extra bonus diamonds with special
double diamond recharge rewards.
</p>

<ul>

<li>First Recharge Bonus</li>

<li>Extra Diamond Rewards</li>

<li>Premium Event Benefits</li>

<li>Bonus Recharge Offers</li>

</ul>

</div>

</div>

<div class="glass-box">

<h2 class="section-title">
ENTER IDS
</h2>

<input
type="text"
placeholder="USER ID"
class="input"
>

<input
type="text"
placeholder="SERVER ID"
class="input"
>

<button class="check-btn">
Check Username
</button>

<div class="username-box">
Username: —
</div>

</div>

<div class="glass-box">

<h2 class="section-title">
Choose Packs
</h2>

<div class="pack-grid">

<button class="pack-btn">
250 Diamonds
</button>

<button class="pack-btn">
500 Diamonds
</button>

<button class="pack-btn">
1000 Diamonds
</button>

</div>

</div>

<div class="glass-box">

<h2 class="section-title">
Choose Payment Method
</h2>

<div class="payment-grid">

<button class="payment-btn">
UPI
</button>

<button class="payment-btn">
Paytm
</button>

<button class="payment-btn">
PhonePe
</button>

</div>

</div>

<button class="buy-btn">
BUY NOW
</button>

</div>

</body>
</html>
