<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>WEEKLY PASS</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<img
src="../assets/frames/ezgif-frame-001.png"
class="background"
>

<div class="overlay"></div>

<div class="container">

<img
src="../assets/products/weekly-pass.png"
class="product-image"
>

<div class="title">
WEEKLY PASS
</div>

<div class="glass-box">

<h2 class="section-title">
Instruction
</h2>

<div class="description">

<p>
You will receive 80 diamonds on the day of purchase,
and the extra 20 diamonds will be sent to the Vault.
</p>

<ul>

<li>220 Diamonds</li>
<li>210 Starlight Scores</li>
<li>7 Diamond Bundle Passes</li>

</ul>

</div>

</div>

<div class="glass-box">

<h2 class="section-title">
ENTER IDS
</h2>

<input
type="text"
placeholder="USER ID"
class="input"
>

<input
type="text"
placeholder="SERVER ID"
class="input"
>

<button class="check-btn">
Check Username
</button>

<div class="username-box">
Username: —
</div>

</div>

<div class="glass-box">

<h2 class="section-title">
Choose Packs
</h2>

<div class="pack-grid">

<button class="pack-btn">
Weekly Pass ×1
</button>

<button class="pack-btn">
Weekly Pass ×2
</button>

<button class="pack-btn">
Weekly Pass ×3
</button>

</div>

</div>

<div class="glass-box">

<h2 class="section-title">
Choose Payment Method
</h2>

<div class="payment-grid">

<button class="payment-btn">
UPI
</button>

<button class="payment-btn">
Paytm
</button>

<button class="payment-btn">
PhonePe
</button>

</div>

</div>

<button class="buy-btn">
BUY NOW
</button>

</div>

</body>
</html>
