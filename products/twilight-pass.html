<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TWILIGHT PASS</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<!-- BACKGROUND -->

<canvas id="bg"></canvas>

<div class="overlay"></div>

<!-- MAIN -->

<div class="container">

<!-- IMAGE -->

<img
src="../assets/products/twilight-pass.png"
class="product-image"
>

<!-- TITLE -->

<h1 class="title">
TWILIGHT PASS
</h1>

<!-- DESCRIPTION -->

<div class="glass-box">

<h2 class="section-title">
Instruction
</h2>

<div class="description">

<ul>

<li>
Exclusive Twilight Pass rewards.
</li>

<li>
Daily premium bonus items included.
</li>

<li>
Safe manual admin delivery process.
</li>

<li>
Fantasy themed premium experience.
</li>

</ul>

</div>

</div>

<!-- IDS -->

<div class="glass-box">

<h2 class="section-title">
ENTER IDS
</h2>

<input
type="text"
placeholder="USER ID"
class="input"
>

<input
type="text"
placeholder="SERVER ID"
class="input"
>

<button class="check-btn">
Check Username
</button>

<div class="username-box">
Username: Not Checked
</div>

</div>

<!-- PACKS -->

<div class="glass-box">

<h2 class="section-title">
Choose Packs
</h2>

<div class="pack-grid">

<button class="pack-btn">
Twilight Pass ×1
</button>

<button class="pack-btn">
Twilight Pass ×2
</button>

<button class="pack-btn">
Twilight Pass ×3
</button>

</div>

</div>

<!-- PAYMENT -->

<div class="glass-box">

<h2 class="section-title">
Choose Payment Method
</h2>

<div class="payment-icons">

<!-- UPI -->

<div class="payment-card">

<img
src="../assets/payments/upi.png"
class="payment-img"
>

<p>
UPI
</p>

</div>

<!-- PHONEPE -->

<div class="payment-card">

<img
src="../assets/payments/phonepe.png"
class="payment-img"
>

<p>
PhonePe
</p>

</div>

<!-- PAYTM -->

<div class="payment-card">

<img
src="../assets/payments/paytm.png"
class="payment-img"
>

<p>
Paytm
</p>

</div>

<!-- GPAY -->

<div class="payment-card">

<img
src="../assets/payments/gpay.png"
class="payment-img"
>

<p>
GPay
</p>

</div>

</div>

<button class="buy-btn">
BUY NOW
</button>

</div>

</div>

<script src="../script.js"></script>

</body>

</html>
