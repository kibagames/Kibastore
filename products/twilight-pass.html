<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Twilight Pass</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<canvas id="bg"></canvas>

<div class="overlay"></div>

<div class="container">

<img
src="../assets/products/twilight-pass.png"
class="product-image"
>

<h1 class="title">
TWILIGHT PASS
</h1>

<div class="glass-box">

<h2 class="section-title">
Instruction
</h2>

<div class="description">

<ul>

<li>
Exclusive twilight themed rewards.
</li>

<li>
Daily login bonus items.
</li>

<li>
Admin assisted safe delivery.
</li>

<li>
Fantasy premium experience.
</li>

</ul>

</div>

</div>

<div class="glass-box">

<h2 class="section-title">
ENTER IDS
</h2>

<input
type="text"
placeholder="USER ID"
class="input"
>

<input
type="text"
placeholder="SERVER ID"
class="input"
>

<button class="check-btn">
Check Username
</button>

<div class="username-box">
Username:
Not Checked
</div>

</div>

<div class="glass-box">

<h2 class="section-title">
Choose Packs
</h2>

<div class="pack-grid">

<button class="pack-btn">
Twilight Pass ×1
</button>

<button class="pack-btn">
Twilight Pass ×2
</button>

<button class="pack-btn">
Twilight Pass ×3
</button>

</div>

</div>

<div class="glass-box">

<h2 class="section-title">
Choose Payment Method
</h2>

<div class="payment-grid">

<button class="payment-btn">
UPI
</button>

<button class="payment-btn">
PhonePe
</button>

<button class="payment-btn">
Paytm
</button>

</div>

</div>

<button class="buy-btn">
BUY NOW
</button>

</div>

<script src="../script.js"></script>

</body>

</html>
